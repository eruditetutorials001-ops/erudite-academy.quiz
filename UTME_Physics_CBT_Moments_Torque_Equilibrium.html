<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erudite Academy · UTME Physics CBT · Moments, Torque &amp; Equilibrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--hd:"Sora","Trebuchet MS",system-ui,sans-serif;--bd:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bg:#fff9ea;--tx:#24160f;--mu:#7a6a5f;--ln:#eddcc0;--y:#ffc20e;--r:#c81d1d;--ok:#16905a;--am:#e8a100;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 var(--bd)}
#app{max-width:480px;margin:0 auto;padding:10px 12px 28px}
button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}
.hero{background:linear-gradient(135deg,#6b0d0d,#c81d1d 70%,#e0432a);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 16px #c81d1d44;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-36px;top:-36px;width:110px;height:110px;border-radius:50%;background:#ffc20e33}
.hero h1,.hero h2{font-family:var(--hd);margin:6px 0 2px;line-height:1.2}
.hero h1{font-size:18px}.hero p{margin:0;opacity:.9;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips span,.tags span{background:#ffffff26;border:1px solid #ffffff44;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600}
.tags span{background:#ffc20e55;border-color:#ffc20e;color:var(--tx)}
.stats,.sc{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--ln);border-radius:14px;margin:10px 0;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--mu)}
.stats b,.sc b{display:block;font:800 17px var(--hd);color:var(--tx)}
.sc .g{color:var(--ok)}.sc .r{color:var(--r)}.sc .a{color:var(--am)}
.go{display:block;width:100%;border:0;border-radius:12px;padding:11px;margin:8px 0;background:var(--y);color:#24160f;font:700 14px var(--hd);box-shadow:0 4px 12px #ffc20e66}
.go.alt{background:#fff;border:2px solid var(--r);color:var(--r);box-shadow:none}
h3{font:700 13px var(--hd);margin:12px 0 4px}
p{margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12.5px var(--hd);margin-bottom:6px}
#tm{background:var(--r);color:#fff;border-radius:99px;padding:3px 11px;font-weight:700;font-variant-numeric:tabular-nums}
#tm.lo{background:var(--y);color:#24160f}
#bc,.sm{background:var(--y);border:0;border-radius:10px;padding:5px 8px;color:#24160f;display:grid;place-items:center}
#bc svg{width:18px;height:18px}
.sm{font:700 11.5px var(--hd)}
.bar{height:4px;background:var(--ln);border-radius:9px;margin-bottom:8px}
.bar u{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--r),var(--y));transition:width .3s}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;box-shadow:0 3px 10px #7a3b0f12}
.ql{font:700 10.5px var(--hd);color:var(--r);letter-spacing:.8px}
.q{font-size:14px;font-weight:500;margin:6px 0 8px;line-height:1.5}
.dg{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:8px;margin-bottom:8px;text-align:center}
.dg svg{width:100%;max-width:340px;height:auto}
svg text{fill:#000;font:600 12px var(--bd)}
.opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#fff;color:var(--tx);border:1.5px solid var(--ln);border-radius:10px;padding:7px 9px;margin-top:6px;font-size:13px}
.opt em{font:700 11px var(--hd);font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--ln);display:grid;place-items:center;flex:none}
.opt span{flex:1}.opt small{display:block;font:700 9px var(--hd);letter-spacing:.5px;margin-top:2px}
.opt:not(:disabled):hover{border-color:var(--r)}
.opt.on{border-color:var(--r);background:#ffc20e40}.opt.on em{background:var(--r);color:#fff;border-color:var(--r)}
.opt.ok{border-color:var(--ok);background:#16905a14;color:var(--ok);opacity:1}.opt.ok em{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--r);background:#c81d1d12;color:var(--r);opacity:1}.opt.bad em{background:var(--r);color:#fff}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.pills button{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--ln);background:#fff;font:700 11.5px var(--hd);color:var(--tx);padding:0}
.pills .dn{background:var(--y);border-color:var(--y)}.pills .gd{border-color:var(--ok);color:var(--ok)}.pills .bd{border-color:var(--r);color:var(--r)}.pills .sk{border-color:var(--am);color:var(--am)}
.pills .cur{outline:2px solid #c81d1d55}
.nv{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;margin-top:4px}
.nv button{border:1.5px solid var(--ln);background:#fff;border-radius:11px;padding:8px 4px;font:700 12px var(--hd);color:var(--tx)}
.nv .sub{background:var(--r);border-color:var(--r);color:#fff}
.badge{display:inline-block;font:700 11px var(--hd);background:#fff;border:1px solid var(--ln);border-radius:99px;padding:2px 10px;margin:0 0 8px}
.ex{background:#fffbe6;border:1px solid var(--y);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.55}
.ex b{font:700 11px var(--hd);color:var(--r)}.ex p{margin:4px 0 0}
.res{display:flex;gap:14px;align-items:center}
.ring{width:96px;flex:none}.res h2{font-size:24px;margin:0}
#calc{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:210px;background:#fff;border:3px solid var(--y);border-radius:16px;padding:8px;box-shadow:0 10px 30px #0004;z-index:20}
#cd{background:var(--bg);border-radius:8px;padding:8px;text-align:right;font-size:19px;min-height:40px;overflow:auto}
.ks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.ks button{padding:9px 0;border:0;border-radius:8px;background:var(--ln);color:var(--tx);font-size:16px}
.ks button:nth-child(4n){background:var(--y)}
.ks button:nth-child(-n+2),.ks button:nth-child(19){background:var(--r);color:#fff}
.bh{position:relative;text-align:center;font:800 15px Montserrat,Nexa,"Trebuchet MS",system-ui,sans-serif;letter-spacing:.2em;padding:6px 0 14px .2em;color:var(--tx)}.bh span{color:var(--r)}
.bh:after{content:"";position:absolute;left:50%;bottom:3px;width:36px;height:3px;border-radius:3px;background:var(--y);transform:translateX(-50%)}
.gate{margin:10px 0;text-align:center}.gate .q{margin:6px 0 10px}
.gate input{width:100%;padding:12px;border:2px solid var(--ln);border-radius:10px;font:700 17px var(--hd);letter-spacing:2px;text-align:center;text-transform:uppercase;background:#fff;color:var(--tx)}
.gate input:focus{outline:0;border-color:var(--r)}
.er{color:var(--r);font:600 12px var(--bd);min-height:18px;margin:6px 0 0}
.ft{text-align:center;color:var(--mu);font:700 10.5px Montserrat,Nexa,"Trebuchet MS",system-ui,sans-serif;letter-spacing:.2em;padding-left:.2em;margin:20px 0 0}
</style></head>
<body>
<div id="app"></div>
<div id="calc" hidden></div>
<script>
const AR='<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#000"/></marker><marker id="d" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="3.5" refY="3" orient="auto-start-reverse"><path d="M0 0L7 3L0 6z" fill="#000"/></marker></defs>';
function R(p,L,D,wl,nm,mk){const x=c=>20+c*3,P=p==null?[]:[].concat(p).map(e=>[].concat(e)),dn=L.filter(l=>l[2]=="a"),hg=L.filter(l=>!l[2]),up=L.filter(l=>l[2]=="u");
const hb=dn.length||wl?134:hg.length?124:P.some(e=>e[1])?116:102,rows=D.length?Math.max(...D.map(d=>d[3]||0))+1:0,H=D.length?hb+16+rows*15:hb+4;
let s=`<svg viewBox="0 0 340 ${H}">${AR}`;
D.forEach(([a,b,t,r])=>{const y=hb+14+(r||0)*15;s+=`<path d="M${x(a)} ${hb-8}V${y+3}M${x(b)} ${hb-8}V${y+3}" stroke="#777" stroke-width=".8" stroke-dasharray="2 2"/><path d="M${x(a)} ${y}H${x(b)}" stroke="#000" marker-start="url(#d)" marker-end="url(#d)"/><text x="${(x(a)+x(b))/2}" y="${y-3}" text-anchor="middle" style="font-size:10px">${t}</text>`});
s+=`<rect x="20" y="62" width="300" height="12" fill="#fff" stroke="#000" stroke-width="1.5"/>`;
(mk||[]).forEach(([c,t])=>{const u=up.some(l=>l[0]==c);s+=`<text x="${x(c)+(u?4:0)}" y="57" text-anchor="${u?"start":"middle"}" style="font-size:10.5px">${t}</text>`});
P.forEach(([c,t])=>{s+=`<path d="M${x(c)} 74l-11 24h22z" fill="#fff" stroke="#000" stroke-width="1.5"/>`+(t?`<text x="${x(c)}" y="112" text-anchor="middle" style="font-size:10.5px">${t}</text>`:"")});
up.forEach(([c,t])=>{s+=`<line x1="${x(c)}" y1="62" x2="${x(c)}" y2="22" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="${x(c)}" y="15" text-anchor="middle">${t}</text>`});
dn.concat(wl?[wl]:[]).forEach(([c,t])=>{s+=`<line x1="${x(c)}" y1="74" x2="${x(c)}" y2="116" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="${x(c)}" y="129" text-anchor="middle">${t}</text>`});
hg.forEach(([c,t])=>{s+=`<line x1="${x(c)}" y1="74" x2="${x(c)}" y2="96" stroke="#000" stroke-width="1.2"/><rect x="${x(c)-19}" y="96" width="38" height="22" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="${x(c)}" y="111" text-anchor="middle" style="font-size:11px">${t}</text>`});
return s+"</svg>"}
const SG='stroke="#24160f" stroke-width="2"';
const E3=`<svg viewBox="0 0 330 124"><g fill="#fff" ${SG}><path d="M8 30Q55 110 102 30V104H8z"/><path d="M118 92Q165 -8 212 92V104H118z"/><path d="M228 84H322V104H228z"/></g><g fill="#8a8a8a" stroke="#000"><circle cx="55" cy="62" r="8"/><circle cx="165" cy="34" r="8"/><circle cx="275" cy="76" r="8"/></g><g text-anchor="middle"><text x="55" y="119">I</text><text x="165" y="119">II</text><text x="275" y="119">III</text></g></svg>`;
const C3=`<svg viewBox="0 0 330 120"><path d="M8 91H322" ${SG}/><g fill="#fff" ${SG}><path d="M27 84L55 22L83 84z"/><path d="M127 22L155 91L183 22z"/><path d="M225 91L284.9 37.9L305.1 90.1z"/></g><g fill="#fff" ${SG}><ellipse cx="55" cy="84" rx="28" ry="7"/><ellipse cx="155" cy="22" rx="28" ry="7"/><ellipse cx="295" cy="64" rx="7" ry="28" transform="rotate(-21 295 64)"/></g><g text-anchor="middle"><text x="55" y="112">I</text><text x="155" y="112">II</text><text x="265" y="112">III</text></g></svg>`;
const WH=`<svg viewBox="0 0 320 142">${AR}<circle cx="160" cy="62" r="46" fill="#fff" ${SG} stroke-width="2"/><path d="M114 62H206M160 16V108" ${SG}/><circle cx="160" cy="62" r="6" fill="#24160f"/><line x1="114" y1="62" x2="114" y2="112" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/><line x1="206" y1="62" x2="206" y2="12" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/><text x="84" y="98">25 N</text><text x="216" y="36">25 N</text><path d="M114 128H206" stroke="#24160f" marker-start="url(#d)" marker-end="url(#d)"/><text x="160" y="124" text-anchor="middle" style="font-size:10px">40 cm</text></svg>`;
const IN=`<svg viewBox="0 0 340 176">${AR}<path d="M270 12H330" stroke="#000" stroke-width="1.5"/><path d="M276 12l8-8M286 12l8-8M296 12l8-8M306 12l8-8M316 12l8-8" stroke="#000"/><line x1="170" y1="96" x2="315.5" y2="12" stroke="#000" stroke-width="1.5"/><path d="M200 96A30 30 0 0 0 196 81" fill="none" stroke="#000"/><text x="204" y="92" style="font-size:10.5px">30°</text><text x="216" y="56" style="font-weight:700">T</text><rect x="20" y="96" width="300" height="12" fill="#fff" stroke="#000" stroke-width="1.5"/><g text-anchor="middle" style="font-size:11px"><text x="14" y="92">A</text><text x="326" y="92">B</text><text x="80" y="92">C</text><text x="160" y="92">D</text><text x="260" y="92">E</text><text x="170" y="124" style="font-size:10.5px">50 cm</text><text x="260" y="146" style="font-size:10.5px">80 cm</text><text x="80" y="170" style="font-size:10.5px">20 cm</text></g><path d="M260 108l-11 24h22z" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="80" y1="108" x2="80" y2="128" stroke="#000" stroke-width="1.2"/><rect x="54" y="128" width="52" height="24" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="80" y="145" text-anchor="middle" style="font-size:11px">0.6 kg</text></svg>`;
const Q=[
{q:"A plank XY, pivoted at its centre of gravity G, is in equilibrium with the weights M and N hanging from its ends, as shown in the diagram. If a further weight 3M is added to M, the plank will be in equilibrium again by",o:["moving N nearer to G","moving M nearer to G","adding a weight 2N to N","moving M further away from G"],a:1,x:"M and N hang at equal distances from G and the plank balances, so M = N = W. After adding 3M, the left side is 4W. For balance, 4W × x = W × d, so x = d ÷ 4: M must be moved nearer to G. Adding 2N to N gives only 3W on the right, which is not enough, and moving N nearer or M further away makes the imbalance worse.",d:R(50,[[5,"M"],[95,"N"]],[],null,0,[[5,"X"],[50,"G"],[95,"Y"]])},
{q:"A uniform metre rule weighing 3 N is balanced at its centre. A load of 8 N is placed 15 cm to the left of the pivot. At what distance d from the pivot should a 6 N load be placed on the right to maintain equilibrium?",o:["15 cm","20 cm","25 cm","30 cm"],a:1,x:"The rule is balanced at its centre, so its own weight passes through the pivot and has no moment. Anticlockwise moment = 8 × 15 = 120 N cm. For balance, 6 × d = 120, so d = 20 cm.",d:R(50,[[35,"8 N","a"],[70,"6 N","a"]],[[35,50,"15 cm"],[50,70,"d"]],null,0)},
{q:"From the figure, a uniform metre rule of weight 30 N is in equilibrium. A string is attached at the 0 cm mark and a pivot is placed at the 40 cm mark. Calculate the tension T in the string.",o:["37.5 N","22.5 N","7.5 N","6.0 N"],a:2,x:"The rule’s weight acts at the 50 cm mark, 10 cm from the pivot. The string is 40 − 0 = 40 cm from the pivot on the other side. Moments about the pivot: T × 40 = 30 × 10, so T = 300 ÷ 40 = 7.5 N.",d:R([[40,"40 cm"]],[[0,"T","u"]],[],[50,"30 N"],0,[[0,"0 cm"],[50,"50 cm"]])},
{q:"The figure shows a uniform metre rule of weight 80 N balanced by a knife edge at the 20 cm mark and a cord attached at the 90 cm mark. What is the tension in the cord?",o:["26.67 N","22.86 N","57.14 N","34.29 N"],a:3,x:"The weight of the rule acts at 50 cm, which is 50 − 20 = 30 cm from the knife edge. The cord is 90 − 20 = 70 cm from the knife edge. T × 70 = 80 × 30, so T = 2400 ÷ 70 = 34.29 N.",d:R([[20,"20 cm"]],[[90,"T","u"]],[],[50,"80 N"],0,[[90,"90 cm"]])},
{q:"From the figure above, a uniform metre rule of weight 60 N is suspended horizontally by two vertical cords attached at the 10 cm and 70 cm marks. Calculate the tension T in the cord at the 10 cm mark.",o:["30 N","20 N","40 N","15 N"],a:1,x:"Take moments about the 70 cm mark so that the tension S drops out. The weight acts at 50 cm, which is 20 cm from the 70 cm mark, and T is 60 cm from it. T × 60 = 60 × 20, so T = 20 N. (Check: S = 60 − 20 = 40 N.)",d:R(null,[[10,"T","u"],[70,"S","u"]],[],[50,"60 N"],0,[[10,"10 cm"],[50,"50 cm"],[70,"70 cm"]])},
{q:"A block of mass 0.6 kg is suspended at the 20 cm mark of a light metre rule AB that is pivoted at point E, the 80 cm mark, and is kept in equilibrium by a string attached at point D, the 50 cm mark, as shown in the figure above. The string makes an angle of 30° with the rule. Find the tension T in the string. [Take g = 10 m s⁻²]",o:["24 N","12 N","13.86 N","48 N"],a:0,x:"Weight of block = 0.6 × 10 = 6 N, acting at C, which is 80 − 20 = 60 cm from E. Its moment about E = 6 × 60 = 360 N cm. The string is 80 − 50 = 30 cm from E, and only T sin 30° acts perpendicular to the rule. So T sin 30° × 30 = 360, giving T × 0.5 × 30 = 360 and T = 24 N.",d:IN},
{q:"Weights of 40 N and 60 N are hung from a light rod as shown in the diagram above (40 N at 3 m from O on one side, 60 N at 2 m from O on the other side). Find the moment of each weight about the point O.",o:["moment of 40 N is 120 N m and 60 N is 120 N m","moment of 40 N is 43 N m and 60 N is 62 N m","moment of 40 N is 180 N m and 60 N is 80 N m","moment of 40 N is 13.3 N m and 60 N is 30 N m"],a:0,x:"Moment = force × perpendicular distance from O. For the 40 N weight: 40 × 3 = 120 N m. For the 60 N weight: 60 × 2 = 120 N m. The two moments are equal and opposite, so the rod balances.",d:R([[40,"O"]],[[10,"40 N","a"],[60,"60 N","a"]],[[10,40,"3 m"],[40,60,"2 m"]],null,0)},
{q:"Calculate the minimum force F required to lift one end of a uniform rod of length 1.5 m and weight 90 N that lies on the ground.",o:["90 N","60 N","45 N","30 N"],a:2,x:"The end on the ground acts as the pivot. The weight acts at the middle of the rod, 0.75 m from the pivot, while F acts at the other end, 1.5 m from it. F × 1.5 = 90 × 0.75, so F = 45 N. The minimum force is always half the weight of a uniform rod.",d:R([[0]],[[100,"F","u"]],[],[50,"90 N"],0)},
{q:"A force of 25 N is applied perpendicular to a door at a distance of 0.8 m from its hinge. Calculate the moment of the force about the hinge.",o:["25.8 N m","20 N m","31.25 N m","200 N m"],a:1,x:"Moment = force × perpendicular distance from the pivot = 25 × 0.8 = 20 N m."},
{q:"Which of the following is an example of a couple?",o:["The forces applied by the fingers when turning a tap","The weight and the normal reaction on a book resting on a table","The pull of a horse on a cart","A single force applied to a door handle"],a:0,x:"A couple is two equal, opposite and parallel forces whose lines of action are different, so they produce pure rotation. The fingers on a tap do exactly this. The weight and reaction of a book act along the same line, so they have no turning effect."},
{q:"A uniform metre rule balances horizontally at the 35 cm mark when a 60 g mass is hung at the 10 cm mark. Calculate the mass of the rule.",o:["100 g","80 g","60 g","50 g"],a:0,x:"The rule’s weight acts at the 50 cm mark, 15 cm from the pivot. The 60 g mass is 35 − 10 = 25 cm from the pivot on the other side. By the principle of moments, 60 × 25 = M × 15, so M = 1500 ÷ 15 = 100 g.",d:R(35,[[10,"60 g"]],[[10,35,"25 cm"],[35,50,"15 cm"]],[50,"M"],1)},
{q:"The uniform metre rule shown is pivoted at the 50 cm mark and balanced by the masses shown. Find the value of m.",o:["80 g","50 g","40 g","25 g"],a:1,x:"The rule is uniform and pivoted at its centre, so its own weight has no moment. Anticlockwise moments: 40 × 40 + 20 × 20 = 1600 + 400 = 2000 g cm. Clockwise moment: m × 40. Equating, 40m = 2000, so m = 50 g.",d:R(50,[[10,"40 g"],[30,"20 g"],[90,"m"]],[[30,50,"20 cm"],[50,90,"40 cm"],[10,50,"40 cm",1]],null,1)},
{q:"A uniform metre rule of weight 4 N has a 6 N weight hung from its 0 cm end. At which mark must the pivot be placed for the rule to balance horizontally?",o:["15 cm","20 cm","25 cm","30 cm"],a:1,x:"Let the pivot be x cm from the 0 cm end. The 6 N weight is x cm from the pivot, while the rule’s weight (4 N at the 50 cm mark) is (50 − x) cm from it. Moments: 6x = 4(50 − x), so 6x = 200 − 4x, giving 10x = 200 and x = 20 cm.",d:R(20,[[0,"6 N"]],[[0,20,"x"],[20,50,"50 − x"]],[50,"4 N"],1)},
{q:"A uniform plank of length 6 m and weight 300 N rests on two supports A and B at its ends. A boy of weight 150 N stands 2 m from A. Calculate the reaction at A.",o:["350 N","300 N","250 N","200 N"],a:2,x:"Take moments about B so that the reaction at B drops out. The plank’s weight acts 3 m from B and the boy is 4 m from B. Clockwise = anticlockwise: R_A × 6 = 300 × 3 + 150 × 4 = 900 + 600 = 1500, so R_A = 250 N. (Check: R_B = 450 − 250 = 200 N.)",d:R([[0,"A"],[100,"B"]],[[33.33,"150 N","a"]],[[0,33.33,"2 m"],[0,100,"6 m",1]],[50,"300 N"])},
{q:"A uniform beam AB, 8 m long and weighing 400 N, rests on supports at A and at C, where C is 2 m from B. A load of 250 N hangs from B. Find the reaction at C.",o:["650 N","600 N","500 N","400 N"],a:1,x:"AC = 6 m. Take moments about A to remove the reaction there. The beam’s weight acts 4 m from A and the load acts 8 m from A. R_C × 6 = 400 × 4 + 250 × 8 = 1600 + 2000 = 3600, so R_C = 600 N. (Check: R_A = 650 − 600 = 50 N.)",d:R([[0,"A"],[75,"C"]],[[100,"250 N","a"]],[[0,75,"6 m"],[75,100,"2 m"]],[50,"400 N"])},
{q:"A force of 60 N acts on a spanner at 30° to the handle, 0.4 m from the nut. Calculate the moment of the force about the nut.",o:["24 N m","20.8 N m","12 N m","6 N m"],a:2,x:"Only the component of the force perpendicular to the handle turns the nut: F sin 30° = 60 × 0.5 = 30 N. Moment = 30 × 0.4 = 12 N m. (Using cos 30° would wrongly give 20.8 N m.)"},
{q:"Two equal and opposite forces of 25 N act tangentially on a steering wheel of diameter 40 cm, as shown. Calculate the torque on the wheel.",o:["5 N m","10 N m","20 N m","100 N m"],a:1,x:"The forces form a couple, so its moment is one force multiplied by the perpendicular distance between them, which here is the diameter, 0.40 m. Torque = 25 × 0.40 = 10 N m. Remember to convert 40 cm to metres first.",d:WH},
{q:"A uniform rod AB of length 2 m and weight 40 N is hinged to a wall at A and held horizontal by a vertical string at B. A 20 N load hangs 0.5 m from B. Find the tension T in the string.",o:["70 N","40 N","30 N","35 N"],a:3,x:"Take moments about the hinge A so the hinge force drops out. Anticlockwise: T × 2. Clockwise: the rod’s weight 40 × 1 plus the load 20 × 1.5. So 2T = 40 + 30 = 70, and T = 35 N.",d:R([[0,"A"]],[[100,"T","u"],[75,"20 N","a"]],[[0,100,"2 m"],[75,100,"0.5 m",1]],[50,"40 N"])},
{q:"Which of the diagrams shows a ball in unstable equilibrium?",o:["I","II","III","I and III"],a:1,n:1,x:"A ball is in unstable equilibrium when any small displacement lowers its centre of gravity, so gravity pushes it further away. On top of the hill (II) a slight push makes the ball roll down. In the bowl (I) the ball returns to the bottom, and on the flat surface (III) it stays where it is put.",d:E3},
{q:"The cone in position III is in",o:["stable equilibrium","unstable equilibrium","neutral equilibrium","no equilibrium"],a:2,x:"Lying on its side, the cone can be rolled without its centre of gravity rising or falling, so it stays in whatever position it is left: neutral equilibrium. Cone I (on its base) is stable and cone II (balanced on its tip) is unstable.",d:C3},
{q:"A body is in equilibrium under three non-parallel coplanar forces. The lines of action of the forces must",o:["be parallel","meet at a point","be perpendicular to one another","lie along the same straight line"],a:1,x:"If the three lines did not meet at one point, two of the forces would meet at a point and the third would have a turning effect about it that nothing could cancel. So the lines must be concurrent, and the three forces must also form a closed triangle."},
{q:"The turning effect of a couple depends on",o:["the sum of the two forces","the magnitude of one force and the perpendicular distance between the forces","the weight of the body only","the distance of the body from the pivot only"],a:1,x:"Moment of a couple = one of the forces × the perpendicular distance between their lines of action. The two forces cancel each other as a resultant, so a couple causes pure rotation, and its moment is the same about every point."},
{q:"A motor exerts a torque of 12 N m on a pulley of radius 0.15 m. The tangential force on the belt is",o:["1.8 N","8 N","80 N","180 N"],a:2,x:"Torque = force × radius, so force = torque ÷ radius = 12 ÷ 0.15 = 80 N."},
{q:"A uniform metre rule of weight 6 N rests on knife edges at the 10 cm and 90 cm marks. A 4 N weight hangs at the 30 cm mark. Find the reaction at the 90 cm knife edge.",o:["3 N","4 N","5 N","6 N"],a:1,x:"Take moments about the 10 cm knife edge: R × 80 = 6 × 40 + 4 × 20 = 240 + 80 = 320, so R = 4 N. (Check: the total downward force is 10 N, so the reaction at the 10 cm knife edge is 6 N.)",d:R([10,90],[[30,"4 N","a"]],[[10,30,"20 cm"],[10,90,"80 cm",1]],[50,"6 N"],1)},
{q:"Which of the following is in neutral equilibrium?",o:["A cone balanced on its tip","A sphere resting on a horizontal table","A cone standing on its base","A pencil standing on its point"],a:1,x:"A sphere on a level surface keeps its centre of gravity at the same height wherever it rolls, so it stays in any new position. The cone on its base is stable; the cone on its tip and the pencil on its point are unstable."},
{q:"A wheelbarrow carries a load of 600 N acting 0.4 m from the axle of the wheel. What effort applied 1.2 m from the axle is needed to just lift the handles?",o:["150 N","200 N","300 N","400 N"],a:1,x:"The axle is the pivot. Clockwise and anticlockwise moments are equal: effort × 1.2 = 600 × 0.4 = 240, so effort = 200 N. The mechanical advantage is 600 ÷ 200 = 3."},
{q:"A mass of 8 kg hangs from a string wound round a drum of radius 25 cm. Calculate the torque of the weight about the axis of the drum. (g = 10 m s⁻²)",o:["2 N m","20 N m","32 N m","200 N m"],a:1,x:"Weight = 8 × 10 = 80 N. The string leaves the rim, so the perpendicular distance is the radius, 0.25 m. Torque = 80 × 0.25 = 20 N m."},
{q:"A uniform metre rule is pivoted at its centre. A 60 g mass hangs at the 20 cm mark and a 40 g mass at the 70 cm mark. Taking g = 10 m s⁻², the resultant moment about the pivot is",o:["0.10 N m clockwise","0.10 N m anticlockwise","0.26 N m anticlockwise","0.26 N m clockwise"],a:1,x:"The weights are 0.6 N and 0.4 N. Anticlockwise moment = 0.6 × 0.30 = 0.18 N m (the 20 cm mark is 30 cm left of the pivot). Clockwise moment = 0.4 × 0.20 = 0.08 N m. The resultant is 0.18 − 0.08 = 0.10 N m anticlockwise, so the left side goes down.",d:R(50,[[20,"60 g"],[70,"40 g"]],[[20,50,"30 cm"],[50,70,"20 cm"]],null,1)},
{q:"A couple of moment 6 N m is produced by two forces of 20 N each. What is the perpendicular distance between the forces?",o:["0.03 m","0.3 m","3 m","30 m"],a:1,x:"Moment of a couple = force × perpendicular distance, so d = 6 ÷ 20 = 0.3 m (30 cm)."},
{q:"A force of 10 N acts along a line that passes through the pivot. Its moment about the pivot is",o:["10 N m","5 N m","1 N m","zero"],a:3,x:"Moment = force × perpendicular distance from the pivot to the line of action. A line of action through the pivot has a perpendicular distance of zero, so the moment is zero and the force produces no turning effect."}];

const HC=["298b0t0uete","17jmz9yxpb6","1ckuqis3woo","6gv13kfo66","13vzbc7sqyt"],HF=s=>{let a=3735928559,b=1103547991;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)},UK="ea_moments_ok";
let U=0;try{U=localStorage.getItem(UK)=="1"}catch(_){}
const gate=()=>`<div class="card gate"><div class="ql">ACCESS CODE</div><p class="q">Enter the access code you received from Erudite Academy to start the exam.</p><input id="ac" type="text" placeholder="EA-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16"><div id="ae" class="er"></div><button class="go" data-a="unlock">🔓 Unlock Quiz</button></div>`;
function unlock(){const v=($("#ac").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(v&&HC.includes(HF(v))){U=1;try{localStorage.setItem(UK,"1")}catch(_){}draw()}else{$("#ae").textContent=v?"Wrong access code. Check it and try again.":"Please enter your access code.";$("#ac").focus()}}

function ev(s){let p=0;
const num=()=>{if(s[p]=="("){p++;const v=add();if(s[p]!=")")throw 0;p++;return v}const m=s.slice(p).match(/^-?\d*\.?\d+/);if(!m)throw 0;p+=m[0].length;return +m[0]};
const mul=()=>{let v=num();while(s[p]=="*"||s[p]=="/"){const o=s[p++],r=num();v=o=="*"?v*r:v/r}return v};
const add=()=>{let v=mul();while(s[p]=="+"||s[p]=="-"){const o=s[p++],r=mul();v=o=="+"?v+r:v-r}return v};
const r=add();if(p<s.length)throw 0;return r}

if(k=="C")ex="";else if(k=="⌫")ex=ex.slice(0,-1);
else if(k=="="){try{const r=ev(ex.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-"));ex=isFinite(r)?String(+r.toPrecision(10)):"Error"}catch(_){ex="Error"}}
